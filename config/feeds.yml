# ---------------------------------------------------------------------------
# RSS SOURCES
#
# Only headline + short summary (the "dek") is pulled. Full article text stays
# on the publisher's site and we always link out. That keeps this on the right
# side of paywalls and copyright -- do NOT change it to scrape article bodies
# from WSJ/FT/Bloomberg.
#
# tier: source priority used to pick the "winner" when two outlets cover the
#       same story (1 = most authoritative, wins ties).
# hint: nudges the scorer's category. It can override if the story disagrees.
#
# Feed URLs rot. Run  `python -m src.verify_feeds`  to see which ones are alive.
# ---------------------------------------------------------------------------

feeds:
  # --- Primary sources: central banks & statistical agencies -----------------
  # These are the highest-signal feeds in the whole file. A CPI print or an FOMC
  # statement shows up here before any journalist writes about it.
  - name: Federal Reserve (all press)
    url: https://www.federalreserve.gov/feeds/press_all.xml
    tier: 1
    hint: Monetary Policy
  - name: Federal Reserve (monetary policy)
    url: https://www.federalreserve.gov/feeds/press_monetary.xml
    tier: 1
    hint: Monetary Policy
  - name: ECB press
    url: https://www.ecb.europa.eu/rss/press.html
    tier: 1
    hint: Monetary Policy
  - name: Bank of England
    url: https://www.bankofengland.co.uk/rss/news
    tier: 1
    hint: Monetary Policy
  - name: BLS latest releases
    url: https://www.bls.gov/feed/bls_latest.rss
    tier: 1
    hint: Macroeconomics
  - name: BEA news
    url: https://apps.bea.gov/rss/rss.xml
    tier: 1
    hint: Macroeconomics
  # Treasury and the IMF no longer publish a working public RSS feed (checked
  # Aug 2026 -- Treasury's /rss/press.xml is gone, the IMF's rss-list endpoint
  # 404s). Their material still reaches you via WSJ, FT and Reuters syndication.

